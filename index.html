<!DOCTYPE html>

<style>
body { font-family: Arial; text-align: center; background: #f2f2f2; margin: 0; }
.header { background: #111; color: white; padding: 30px; }
.header img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #00ff88; }
.contact-card { background: white; margin: 20px; padding: 20px; border-radius: 15px; }
.btn { display: block; width: 90%; margin: 10px auto; padding: 15px; border: none; border-radius: 10px; color: white; font-size: 18px; cursor: pointer; font-weight: bold; }
.btn-whatsapp { background: #25D366; }
.btn-call { background: #007bff; }
.btn-facebook { background: #1877F2; }
.btn-mail { background: #EA4335; }
.btn-order { background: #FF5722; font-size: 20px; padding: 18px; }
.address { margin: 15px 0; font-size: 16px; }
.address a { color: #00ff88; text-decoration: none; font-weight: bold; }
.address a:hover { text-decoration: underline; }

/* 1. GALLERY - Picture choti karne ke liye */
.gallery { 
  display: flex; 
  flex-wrap: wrap; 
  justify-content: center; 
  gap: 15px; 
  margin-top: 20px; 
}
.gallery img { 
  width: 45%; /* 2 photo side by side */
  max-width: 300px; 
  border-radius: 10px; 
  border: 3px solid #ddd; 
  height: 250px; 
  object-fit: cover; /* photo cut na ho */
}

/* 2. PRICE LIST */
.product { background: #fafafa; padding: 15px; border-radius: 10px; margin: 15px 0; border: 2px solid #eee; }
.product h3 { color: #111; margin: 5px 0; }
.price { color: #25D366; font-size: 22px; font-weight: bold; }
.size { background: #111; color: white; padding: 5px 10px; border-radius: 5px; display: inline-block; margin: 5px; }
</style>
</head>
